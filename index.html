
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my 3d website</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            z-index: 10;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="title">
        <h1>3d model viewer</h1>
        <p>drag to rotate | scroll to zoom</p>
    </div>

    <div id="status">loading model...</div>

    <script type="module">
        import * as THREE from
        'https://esm.sh/three@0.170.0';

        import { GLTFLoader } from
        'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

        import { OrbitControls } from
        'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';

        // scene
        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x111111);

        // camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 1.5, 4);

        // renderer
        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.outputColorSpace = THREE.SRGBColorSpace;

        document.body.appendChild(renderer.domElement);

        // lighting
        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            2
        );

        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(
            0xffffff,
            3
        );

        directionalLight.position.set(5, 10, 5);

        scene.add(directionalLight);

        // controls
        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;

        // load model from repository
        const loader = new GLTFLoader();

        loader.load(
            './assets/person.glb',

            function (gltf) {
                const model = gltf.scene;

                scene.add(model);

                // automatically center the model
                const box = new THREE.Box3().setFromObject(model);

                const center = box.getCenter(
                    new THREE.Vector3()
                );

                model.position.sub(center);

                // adjust camera to fit model
                const size = box.getSize(
                    new THREE.Vector3()
                );

                const maxSize = Math.max(
                    size.x,
                    size.y,
                    size.z
                );

                camera.position.set(
                    0,
                    maxSize * 0.5,
                    maxSize * 2
                );

                controls.target.set(0, 0, 0);

                controls.update();

                document.getElementById('status').textContent =
                    'model loaded successfully';
            },

            undefined,

            function (error) {
                console.error(error);

                document.getElementById('status').textContent =
                    'failed to load model. check the file path.';
            }
        );

        // animation loop
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // resize
        window.addEventListener('resize', () => {
            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });
    </script>

</body>
</html>
